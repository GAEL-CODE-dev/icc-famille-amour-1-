<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#fff8f6" />
  <title>Inscription membre | ICC Famille Amour</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./css/tokens.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>
  <style>
    body {
      min-height: 100vh;
      background: var(--icc-cream);
      color: var(--icc-ink);
      font-family: "DM Sans", sans-serif;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 20;
      min-height: 76px;
      border-bottom: 1px solid rgba(236, 217, 217, 0.8);
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 6px 24px rgba(64, 22, 22, 0.04);
      backdrop-filter: blur(14px);
    }

    .site-nav {
      display: flex;
      min-height: 76px;
      align-items: center;
      justify-content: space-between;
      gap: 1.25rem;
    }

    .brand-link {
      display: inline-flex;
      min-width: 0;
      align-items: center;
      gap: 0.75rem;
      color: var(--icc-ink);
      text-decoration: none;
    }

    .brand-copy {
      display: grid;
      gap: 0.1rem;
      line-height: 1.2;
    }

    .brand-name {
      font-size: 0.95rem;
      font-weight: 700;
    }

    .brand-caption {
      color: var(--icc-ink-soft);
      font-size: 0.72rem;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .nav-link {
      display: inline-flex;
      min-height: 2.75rem;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.65rem 0.9rem;
      border: 1px solid transparent;
      border-radius: 0.625rem;
      color: var(--icc-ink-soft);
      font-size: 0.875rem;
      font-weight: 600;
      text-decoration: none;
      transition: background-color 150ms ease, color 150ms ease, border-color 150ms ease;
    }

    .nav-link:hover {
      background: var(--icc-red-soft);
      color: var(--icc-red-dark);
    }

    .nav-link-current {
      color: var(--icc-red-dark);
    }

    .nav-link-admin {
      border-color: var(--icc-red);
      background: var(--icc-red);
      color: white;
    }

    .nav-link-admin:hover {
      border-color: var(--icc-red-dark);
      background: var(--icc-red-dark);
      color: white;
    }

    @media (max-width: 480px) {
      .site-nav {
        gap: 0.5rem;
      }

      .brand-caption,
      .nav-link-current span {
        display: none;
      }

      .nav-link {
        padding-inline: 0.7rem;
        font-size: 0.8rem;
      }
    }

    .page-width {
      width: min(100% - 2rem, 70rem);
      margin-inline: auto;
    }

    .brand-mark {
      display: grid;
      width: 2.75rem;
      height: 2.75rem;
      place-items: center;
      border-radius: 50%;
      background: var(--icc-red);
      color: white;
    }

    .registration-wrap {
      width: min(100% - 2rem, 52rem);
      margin: 3.5rem auto;
    }

    .registration-panel {
      overflow: hidden;
      border: 1px solid var(--icc-line);
      border-radius: 1rem;
      background: white;
      box-shadow: 0 14px 36px rgba(64, 22, 22, 0.06);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1.25rem;
    }

    .field {
      display: grid;
      gap: 0.45rem;
    }

    .field-wide {
      grid-column: 1 / -1;
    }

    .field-label {
      color: var(--icc-ink);
      font-size: 0.875rem;
      font-weight: 600;
    }

    .field-control {
      width: 100%;
      min-height: 3rem;
      padding: 0.75rem 0.875rem;
      border: 1px solid var(--icc-line);
      border-radius: 0.625rem;
      background: white;
      color: var(--icc-ink);
      font: inherit;
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }

    .field-control::placeholder {
      color: #897d7d;
    }

    .field-control:focus-visible {
      border-color: var(--icc-red);
      outline: 2px solid transparent;
      box-shadow: 0 0 0 3px var(--icc-red-soft);
    }

    textarea.field-control {
      min-height: 7rem;
      resize: vertical;
    }

    .submit-button {
      display: inline-flex;
      min-height: 3rem;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      padding: 0.75rem 1.25rem;
      border: 0;
      border-radius: 0.625rem;
      background: var(--icc-red);
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 150ms ease, transform 150ms ease;
    }

    .submit-button:hover {
      background: var(--icc-red-dark);
    }

    .submit-button:active {
      transform: translateY(1px);
    }

    .submit-button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .form-status {
      padding: 0.875rem 1rem;
      border: 1px solid transparent;
      border-radius: 0.625rem;
      font-size: 0.9rem;
    }

    .form-status[data-state="error"] {
      border-color: #e7b7b7;
      background: #fff1f0;
      color: #821a1a;
    }

    .form-status[data-state="success"] {
      border-color: #a8d4bd;
      background: #effaf3;
      color: #145a35;
    }

    .skip-link {
      position: absolute;
      top: -4rem;
      left: 1rem;
      z-index: 10;
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      background: var(--icc-red);
      color: white;
    }

    .skip-link:focus {
      top: 1rem;
    }

    @media (max-width: 640px) {
      .registration-wrap {
        margin-block: 2rem;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .field-wide {
        grid-column: auto;
      }

      .registration-panel form {
        padding: 1.25rem;
      }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">Aller au formulaire</a>

  <header class="site-header">
    <div class="page-width flex min-h-[76px] items-center justify-between gap-4">
    <nav class="page-width site-nav" aria-label="Navigation principale">
      <a href="./index.html" class="brand-link" aria-label="ICC Famille Amour, accueil">
        <img src="./logo/edcf925a-ec94-41cc-bbc4-f971ba7298c3.JPG" alt="Logo ICC Famille Amour" class="brand-mark" style="width: 2.75rem; height: 2.75rem; object-fit: cover; border-radius: 50%;" />
        <span class="brand-copy">
          <strong class="brand-name">ICC Famille</strong>
          <span class="brand-caption">Amour</span>
        </span>
      </a>
      <div class="nav-actions">
        <a class="nav-link nav-link-current" href="#member-registration-form" aria-current="page">
          <i data-lucide="user-round-plus" width="17" height="17" aria-hidden="true"></i>
          <span>Inscription</span>
        </a>
        <a class="nav-link nav-link-admin" href="./login.html">
          <i data-lucide="shield-check" width="17" height="17" aria-hidden="true"></i>
          <span>Espace admin</span>
        </a>
      </div>
    </nav>
  </header>

  <main id="main-content" class="registration-wrap">
    <header class="mb-6">
      <p class="mb-2 text-xs font-bold uppercase tracking-wide" style="color: var(--icc-red);">ICC Famille Amour</p>
      <h1 class="text-3xl font-bold tracking-tight">Enregistrement d’un membre</h1>
      <p class="mt-2 max-w-2xl text-sm leading-6" style="color: var(--icc-ink-soft);">
        Renseignez les coordonnées du nouveau membre. Les champs marqués d’un astérisque sont obligatoires.
      </p>
    </header>

    <section class="registration-panel" aria-labelledby="form-title">
      <div class="border-b px-5 py-4 sm:px-7" style="border-color: var(--icc-line);">
        <h2 id="form-title" class="font-bold">Coordonnées du membre</h2>
      </div>

      <form id="member-registration-form" class="p-5 sm:p-7" novalidate>
        <div id="form-status" class="form-status mb-5 hidden" role="status" aria-live="polite" tabindex="-1"></div>

        <div class="form-grid">
          <div class="field">
            <label class="field-label" for="prenom">Prénom <span aria-hidden="true">*</span></label>
            <input class="field-control" id="prenom" name="prenom" type="text" autocomplete="given-name" maxlength="100" required />
          </div>

          <div class="field">
            <label class="field-label" for="nom">Nom <span aria-hidden="true">*</span></label>
            <input class="field-control" id="nom" name="nom" type="text" autocomplete="family-name" maxlength="100" required />
          </div>

          <div class="field">
            <label class="field-label" for="telephone">Téléphone</label>
            <input class="field-control" id="telephone" name="telephone" type="tel" autocomplete="tel" inputmode="tel" maxlength="30" />
          </div>

          <div class="field">
            <label class="field-label" for="email">Adresse e-mail</label>
            <input class="field-control" id="email" name="email" type="email" autocomplete="email" maxlength="254" />
          </div>

          <div class="field">
            <label class="field-label" for="date_naissance">Date de naissance</label>
            <input class="field-control" id="date_naissance" name="date_naissance" type="date" autocomplete="bday" />
          </div>

          <div class="field">
            <label class="field-label" for="adresse">Adresse</label>
            <input class="field-control" id="adresse" name="adresse" type="text" autocomplete="street-address" maxlength="250" />
          </div>

          <div class="field field-wide">
            <label class="field-label" for="notes">Notes complémentaires</label>
            <textarea class="field-control" id="notes" name="notes" maxlength="1000"></textarea>
          </div>
        </div>

        <div class="mt-6 flex flex-col-reverse items-stretch justify-between gap-3 border-t pt-5 sm:flex-row sm:items-center" style="border-color: var(--icc-line);">
          <p class="text-xs" style="color: var(--icc-ink-soft);">Les coordonnées restent modifiables par l’administration.</p>
          <button id="submit-member" class="submit-button" type="submit">
            <i data-lucide="user-round-plus" width="18" height="18" aria-hidden="true"></i>
            Enregistrer le membre
          </button>
        </div>
      </form>
    </section>
  </main>

  <script src="./js/runtime-config.js"></script>
  <script type="module" src="./js/pages/registration.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => window.lucide?.createIcons());
  </script>
</body>
</html>
